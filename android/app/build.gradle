plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.online_banking_system"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    // Add buildFeatures for ViewBinding
    buildFeatures {
        viewBinding true
    }

    defaultConfig {
        applicationId = "com.example.online_banking_system"
        minSdk = flutter.minSdkVersion
        targetSdk = 33  // Set a specific target SDK version for compatibility
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }

    // Add this to ensure compatibility with FragmentActivity
    dependencies {
        implementation "androidx.appcompat:appcompat:1.4.1"
        implementation "androidx.fragment:fragment:1.4.1"
    }
}

flutter {
    source = "../.."
}

// Add these dependencies to support biometric authentication
dependencies {
    implementation "androidx.biometric:biometric:1.1.0"
}